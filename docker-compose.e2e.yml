# Override for the Playwright E2E suite (Task 23): fixed test credentials and a
# distinct host port so E2E never collides with a local dev stack.
services:
  server:
    ports:
      - "127.0.0.1:8790:8787"
    environment:
      DATABASE_URL: postgres://quire:e2e@postgres:5432/quire
      QUIRE_API_KEY: e2e-test-key-0000000000000000000000
      UNLOCK_SECRET: e2e-unlock-secret-0000000000000000
      # The E2E client is a single IP that legitimately exceeds the production
      # 120 req/60s public volume window across the v1+v2 suites; raise it so
      # the suite never trips the 429 (the 429 path stays unit-tested).
      QUIRE_PUBLIC_RATE_LIMIT: "100000"

  postgres:
    environment:
      POSTGRES_PASSWORD: e2e

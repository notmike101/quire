services:
  server:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      DATABASE_URL: postgres://quire:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}@postgres:5432/quire
      QUIRE_API_KEY: ${QUIRE_API_KEY:?QUIRE_API_KEY is required (see .env.example)}
      UNLOCK_SECRET: ${UNLOCK_SECRET:?UNLOCK_SECRET is required (see .env.example)}
      PORT: "8787"
      WEB_DIST: /app/web-dist
      # Canary (Task 14): v2 writes are OFF by default during the canary
      # window; flip to true once v2 is verified. Never disables v2 reads.
      QUIRE_V2_WRITE_ENABLED: ${QUIRE_V2_WRITE_ENABLED:-false}
      # v1 public reads are ON by default; flip to false immediately once v2
      # is verified (no grace window) to retire v1 links.
      QUIRE_V1_READS_ENABLED: ${QUIRE_V1_READS_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
      POSTGRES_DB: quire
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quire -d quire"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
